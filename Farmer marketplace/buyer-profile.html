<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Profile - FarmDirect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">🌾 FarmDirect</div>
            <div class="nav-menu">
                <a href="index.html">Marketplace</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 2rem;">
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
            <!-- Profile Column -->
            <div>
                <div class="login-card" style="width: 100%; text-align: center;">
                    <div id="profile-photo-container" style="margin-bottom: 1rem;">
                        <span style="font-size: 4rem;">🛒</span>
                    </div>
                    <h2 id="buyer-name">Buyer Name</h2>
                    <p id="buyer-email" style="color: #666;">email@example.com</p>
                    <p id="buyer-phone" style="color: #666;">+91 00000 00000</p>
                    <hr style="margin: 1rem 0; border: 0; border-top: 1px solid #eee;">
                    <div style="text-align: left;">
                        <strong>Delivery Address:</strong>
                        <p id="buyer-address" style="font-size: 0.9rem; margin-top: 0.5rem;"></p>
                    </div>
                </div>
            </div>

            <!-- Orders/Cart Column -->
            <div>
                <div style="background: white; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <h3>My Dashboard</h3>
                    <p style="color: #666; margin-top: 1rem;">Welcome back! Here you can view your profile details and manage your account.</p>
                    
                    <div style="margin-top: 2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="feature-card" style="padding: 1rem;">
                            <h4>Recent Activity</h4>
                            <p style="font-size: 0.8rem; color: #666;">No recent orders yet.</p>
                        </div>
                        <div class="feature-card" style="padding: 1rem;">
                            <h4>Account Status</h4>
                            <p style="font-size: 0.8rem; color: #2ecc71;">Active</p>
                        </div>
                    </div>

                    <button class="btn-primary" style="margin-top: 2rem;" onclick="window.location.href='index.html'">Browse Products</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || user.role !== 'buyer') {
            window.location.href = 'buyer-login.html';
        }

        document.getElementById('buyer-name').textContent = user.fullName;
        document.getElementById('buyer-email').textContent = user.email;

        const API_BASE_URL = (window.location.port === '3000') 
            ? window.location.origin 
            : 'http://localhost:3000';

        async function loadProfile() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('buyer-phone').textContent = data.user.phone || 'Not provided';
                    document.getElementById('buyer-address').textContent = data.user.address || 'Not provided';
                }
            } catch (err) { console.error(err); }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        loadProfile();
    </script>
</body>
</html>
