<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Dashboard - FarmDirect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">🌾 FarmDirect</div>
            <div class="nav-menu">
                <a href="index.html">Marketplace</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 2rem;">
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
            <!-- Profile Column -->
            <div>
                <div class="login-card" style="width: 100%; text-align: center;">
                    <div id="profile-photo-container" style="margin-bottom: 1rem;">
                        <span style="font-size: 4rem;">👨‍🌾</span>
                    </div>
                    <h2 id="farmer-name">Farmer Name</h2>
                    <p id="farmer-email" style="color: #666;">email@example.com</p>
                    <p id="farmer-phone" style="color: #666;">+91 00000 00000</p>
                    <hr style="margin: 1rem 0; border: 0; border-top: 1px solid #eee;">
                    <div style="text-align: left;">
                        <strong>Address:</strong>
                        <p id="farmer-address" style="font-size: 0.9rem; margin-top: 0.5rem;"></p>
                    </div>
                </div>
            </div>

            <!-- Products Column -->
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2>My Products</h2>
                    <button class="btn-primary" onclick="openAddModal()">Add New Product</button>
                </div>
                <div id="my-products-list" class="products-grid">
                    <!-- Farmer's products will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div id="add-product-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddModal()">&times;</span>
            <h2>Add New Product</h2>
            <form id="add-product-form">
                <input type="text" id="p-name" placeholder="Product Name" class="input-field" required>
                <select id="p-category" class="input-field" required>
                    <option value="Vegetables">Vegetables</option>
                    <option value="Fruits">Fruits</option>
                    <option value="Grains">Grains</option>
                    <option value="Dairy">Dairy</option>
                    <option value="Honey">Honey</option>
                </select>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="p-price" placeholder="Price (₹)" class="input-field" step="0.01" required>
                    <input type="number" id="p-quantity" placeholder="Quantity" class="input-field" required>
                    <input type="text" id="p-unit" placeholder="Unit (kg/ltr)" class="input-field" required>
                </div>
                <textarea id="p-desc" placeholder="Product Description" class="input-field"
                    style="height: 100px;"></textarea>
                <button type="submit" class="btn-primary" style="width: 100%;">Upload Product</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || user.role !== 'farmer') {
            window.location.href = 'farmer-login.html';
        }

        document.getElementById('farmer-name').textContent = user.fullName;
        document.getElementById('farmer-email').textContent = user.email;

        const API_BASE_URL = (window.location.port === '3000') 
            ? window.location.origin 
            : 'http://localhost:3000';

        async function loadProfile() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('farmer-phone').textContent = data.user.phone;
                    document.getElementById('farmer-address').textContent = data.user.address;
                }
            } catch (err) { console.error(err); }
        }

        async function loadMyProducts() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/farmer/products`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                const list = document.getElementById('my-products-list');
                list.innerHTML = '';

                if (data.success && data.data) {
                    data.data.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <div class="product-header">${p.icon || '📦'}</div>
                            <div class="product-body">
                                <div class="product-name">${p.name}</div>
                                <div class="product-price">₹${p.price.toFixed(2)}/${p.unit}</div>
                                <div class="product-quantity">Qty: ${p.quantity} ${p.unit}</div>
                                <div class="product-actions" style="margin-top: 1rem;">
                                    <button class="btn-danger small-btn" onclick="deleteProduct(${p.id})">Delete</button>
                                </div>
                            </div>
                        `;
                        list.appendChild(card);
                    });
                }
            } catch (err) { console.error(err); }
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            try {
                const response = await fetch(`${API_BASE_URL}/api/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    loadMyProducts();
                } else {
                    alert(data.message);
                }
            } catch (err) { alert('Failed to delete product'); }
        }

        function openAddModal() { document.getElementById('add-product-modal').classList.add('active'); }
        function closeAddModal() { document.getElementById('add-product-modal').classList.remove('active'); }

        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const productData = {
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                price: parseFloat(document.getElementById('p-price').value),
                quantity: parseFloat(document.getElementById('p-quantity').value),
                unit: document.getElementById('p-unit').value,
                description: document.getElementById('p-desc').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productData)
                });
                const data = await response.json();
                if (data.success) {
                    closeAddModal();
                    loadMyProducts();
                    document.getElementById('add-product-form').reset();
                } else {
                    alert(data.message);
                }
            } catch (err) { alert('Failed to add product'); }
        });

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        loadProfile();
        loadMyProducts();
    </script>
</body>

</html>
